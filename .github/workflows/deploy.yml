name: Deploy

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: dwayne/nix-mdBook/.github/workflows/ci.yml@4a7591f3a43e35de214ee69497dc1c7639041cf8

  deploy:
    needs: ci
    permissions:
      contents: write
    uses: dwayne/nix-mdBook/.github/workflows/deploy.yml@4a7591f3a43e35de214ee69497dc1c7639041cf8
